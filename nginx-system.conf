# Main nginx configuration file for Amenshi 4 Life

# Logging
log_format amenshi_main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" '
                'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

access_log /var/log/nginx/access.log amenshi_main buffer=32k flush=5s;
error_log /var/log/nginx/error.log warn;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Buffer sizes
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 10m;  # For file uploads
    large_client_header_buffers 4 8k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    reset_timedout_connection on;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/atom+xml
        image/svg+xml;
    gzip_disable "msie6";
    
    # Cache settings for static assets
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Upstream servers
    upstream amenshi_backend {
        server localhost:3002;
        keepalive 32;
    }
    
    upstream amenshi_frontend {
        server localhost:3003;
        keepalive 32;
    }
    
    # ===== AMENSHI 4 LIFE FRONTEND (amenshi4life.livingii.com) =====
    server {
        listen 80;
        server_name amenshi4life.livingii.com;
        
        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name amenshi4life.livingii.com;
        
        # SSL certificates for frontend domain
        ssl_certificate /etc/letsencrypt/live/amenshi4life.livingii.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/amenshi4life.livingii.com/privkey.pem;
        
        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' https://amenshi4lifebackend.livingii.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://amenshi4lifebackend.livingii.com;" always;
        
        # Frontend - SPA support
        location / {
            proxy_pass http://amenshi_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # For SPA: return index.html for all non-file requests
            try_files $uri $uri/ /index.html;
        }
        
        # Health check endpoint (internal)
        location /health {
            internal;
            proxy_pass http://amenshi_frontend/health;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;  # Docker internal network
            deny all;
        }
        
        # Static file caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # Block sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Custom error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
    
    # ===== AMENSHI 4 LIFE BACKEND API (amenshi4lifebackend.livingii.com) =====
    server {
        listen 80;
        server_name amenshi4lifebackend.livingii.com;
        
        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name amenshi4lifebackend.livingii.com;
        
        # SSL certificates for backend domain
        ssl_certificate /etc/letsencrypt/live/amenshi4lifebackend.livingii.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/amenshi4lifebackend.livingii.com/privkey.pem;
        
        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        
        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Backend API - Preserve /api prefix
        location /api/ {
            proxy_pass http://amenshi_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Disable buffering for API responses
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            
            # CORS headers - allow only frontend domain
            add_header Access-Control-Allow-Origin 'https://amenshi4life.livingii.com' always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept, Origin, User-Agent, Cache-Control, X-Requested-With' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;
            add_header Access-Control-Max-Age 3600 always;
            
            # Handle OPTIONS for CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin 'https://amenshi4life.livingii.com';
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept, Origin, User-Agent, Cache-Control, X-Requested-With';
                add_header Access-Control-Max-Age 3600;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }
        }
        
        # Uploads directory
        location /uploads/ {
            alias /home/$USER/amenshi-app/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin 'https://amenshi4life.livingii.com' always;
            
            # Allow uploading of large files
            client_max_body_size 10M;
        }
        
        # Health check endpoint (internal)
        location /health {
            internal;
            proxy_pass http://amenshi_backend/api/health;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;  # Docker internal network
            deny all;
        }
        
        # Status page for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }
        
        # Block everything else on backend domain
        location / {
            return 403;
        }
        
        # Block sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # Status page for monitoring (global)
    server {
        listen 8080;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
