version: '3.8'

services:
  # Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: amenshi4life-server
    restart: unless-stopped
    ports:
      - "5000:5000"  # Change external port to avoid conflicts (e.g., "5001:5000")
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads  # Persist uploads
    networks:
      - amenshi-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Nginx serving React build)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: amenshi4life-client
    restart: unless-stopped
    ports:
      - "80:80"  # Change external port to avoid conflicts (e.g., "8080:80")
    depends_on:
      - server
    networks:
      - amenshi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  amenshi-network:
    driver: bridge
