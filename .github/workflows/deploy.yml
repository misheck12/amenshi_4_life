name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.x'

jobs:
  # ==================== BUILD & TEST ====================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [client, server]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        working-directory: ./${{ matrix.app }}
        run: npm ci

      - name: Run Linter (Client Only)
        if: matrix.app == 'client'
        working-directory: ./client
        run: npm run lint || true

      - name: Build Application
        working-directory: ./${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" == "client" ]; then
            npm run build
          else
            echo "Server doesn't require build step"
          fi

      - name: Upload Build Artifacts (Client)
        if: matrix.app == 'client' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist
          retention-days: 7

  # ==================== DEPLOY TO VM ====================
  deploy:
    name: Deploy to VM
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Client Build
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: client/dist

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd ${{ secrets.VM_PROJECT_PATH }}
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git pull origin main
            
            # Install server dependencies
            echo "📦 Installing server dependencies..."
            cd server
            npm ci --production
            
            # Restart server (using PM2)
            echo "🔄 Restarting server..."
            pm2 restart amenshi4life-server || pm2 start server.js --name amenshi4life-server
            
            # Install and build client
            echo "🎨 Building client..."
            cd ../client
            npm ci
            npm run build
            
            # Copy build to web server directory (if using nginx/apache)
            # Adjust the path based on your nginx/apache configuration
            echo "📋 Deploying client build..."
            sudo rm -rf /var/www/amenshi4life/*
            sudo cp -r dist/* /var/www/amenshi4life/
            
            # Restart nginx
            echo "🔄 Restarting nginx..."
            sudo systemctl reload nginx
            
            echo "✅ Deployment completed successfully!"

      - name: Notify Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi

  # ==================== HEALTH CHECK ====================
  health-check:
    name: Post-Deployment Health Check
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Wait for deployment
        run: sleep 10

      - name: Check API Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.API_URL }}/health || echo "000")
          if [ "$response" == "200" ]; then
            echo "✅ API is responding (HTTP $response)"
          else
            echo "⚠️ API health check returned HTTP $response"
            exit 1
          fi

      - name: Check Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.FRONTEND_URL }} || echo "000")
          if [ "$response" == "200" ]; then
            echo "✅ Frontend is accessible"
          else
            echo "⚠️ Frontend check returned HTTP $response"
            exit 1
          fi
