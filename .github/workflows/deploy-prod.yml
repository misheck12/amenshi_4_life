name: Amenshi 4 Life CI/CD Pipeline

on:
  push:
    branches: [ About-us ]  # Your default branch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: About-us

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server   # Your server folder
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:About-us
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:buildcache,mode=max
          build-args: |
            NODE_ENV=production

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:About-us
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_number }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/About-us'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: About-us

      - name: Copy configuration files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,nginx-system.conf,nginx/sync.conf,scripts/setup-vm.sh"
          target: "~/amenshi-app"
          strip_components: 0

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Go to the Specific Amenshi Folder (CRITICAL)
            cd ~/amenshi-app
            
            # Create .env file with all secrets
            cat > .env << 'EOF'
            # MongoDB
            MONGODB_URI=${{ secrets.MONGODB_ATLAS_URI }}
            
            # JWT Authentication
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRE=24h
            
            # Cloudinary Configuration
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            
            # Email Configuration
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            
            # Application URLs
            CLIENT_URL=https://amenshi4life.livingii.com
            API_BASE_URL=https://amenshi4lifebackend.livingii.com
            
            # Donation URL
            DONATION_URL=https://app.clovergive.com/App/Giving/talm10e206
            
            NODE_ENV=production
            PORT=3005
            EOF
            chmod 600 .env
            
            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 🧹 SAFE CLEANUP PROCESS (AMENSHI ONLY)
            echo "🧹 Starting cleanup for Amenshi..."
            
            # Stop ONLY Amenshi containers
            docker stop amenshi_backend amenshi_frontend 2>/dev/null || true
            docker rm amenshi_backend amenshi_frontend 2>/dev/null || true
            
            # Clean up any containers with amenshi in the name
            docker ps -a --filter "name=amenshi" --format "{{.ID}}" | xargs -r docker rm -f 2>/dev/null || true
            
            # Stop and remove via docker-compose (handles networks too)
            docker-compose -f docker-compose.prod.yml down --remove-orphans --volumes 2>/dev/null || true
            
            # Clean up ONLY Amenshi network
            docker network rm amenshi_network 2>/dev/null || true
            
            # Force remove old images to ensure fresh pull
            docker rmi ghcr.io/misheck12/amenshi_4_life/frontend:About-us --force 2>/dev/null || true
            docker rmi ghcr.io/misheck12/amenshi_4_life/backend:About-us --force 2>/dev/null || true
            
            echo "✅ Cleanup completed! (Sync was untouched)"
            
            # Pull latest images (force fresh)
            echo "📥 Pulling latest images..."
            docker pull ghcr.io/misheck12/amenshi_4_life/frontend:About-us
            docker pull ghcr.io/misheck12/amenshi_4_life/backend:About-us
            
            # Ensure uploads directory exists and has correct permissions
            # We use 777 here to ensure the nodejs user inside the container (UID 1001) can write to it
            mkdir -p uploads
            chmod 777 uploads
            
            # Start all services
            docker-compose -f docker-compose.prod.yml up -d
            
            # Wait for services to be healthy
            echo "⏳ Waiting for services to be ready..."
            
            # Wait for backend (port 3005)
            for i in {1..30}; do
              if curl -s -f http://localhost:3005/health > /dev/null 2>&1; then
                echo "✅ Backend is ready!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "⚠️ Backend health check timeout"
                docker logs amenshi_backend --tail=50
                exit 1
              fi
              sleep 3
            done
            
            # Wait for frontend (port 3080)
            for i in {1..20}; do
              if curl -s -f http://localhost:3080 > /dev/null 2>&1; then
                echo "✅ Frontend is ready!"
                break
              fi
              if [ $i -eq 20 ]; then
                echo "⚠️ Frontend health check timeout"
                docker logs amenshi_frontend --tail=50
                exit 1
              fi
              sleep 2
            done
            
            # Configure system nginx
            echo "🔧 Configuring system nginx..."
            
            # Remove old/duplicate amenshi configs
            sudo rm -f /etc/nginx/sites-enabled/amenshi4life || true
            sudo rm -f /etc/nginx/sites-enabled/amenshi4lifebackend || true
            
            # Substitute username in nginx config
            sed -i "s/deployment_user_placeholder/$USER/g" nginx-system.conf
            
            # Install nginx config
            sudo cp ~/amenshi-app/nginx-system.conf /etc/nginx/sites-available/amenshi4life
            sudo ln -sf /etc/nginx/sites-available/amenshi4life /etc/nginx/sites-enabled/
            
            # Test nginx configuration
            sudo nginx -t || {
              echo "❌ nginx configuration error"
              exit 1
            }
            
            # Reload nginx (Safer than restart)
            sudo systemctl reload nginx
            
            # Show deployment status
            echo "📊 Deployment Status:"
            docker-compose -f docker-compose.prod.yml ps
            
            # Test the application
            echo "🧪 Testing application..."
            if curl -s -f https://amenshi4life.livingii.com > /dev/null 2>&1; then
              echo "✅ Frontend is accessible via domain!"
            else
              echo "⚠️ Frontend might not be accessible via domain"
            fi
            
            if curl -s -f https://amenshi4lifebackend.livingii.com/api/health > /dev/null 2>&1; then
              echo "✅ Backend API is accessible via domain!"
            else
              echo "⚠️ Backend API might not be accessible via domain"
            fi
            
            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f --filter "until=48h"
            
            echo "🎉 Amenshi 4 Life deployment completed successfully!"