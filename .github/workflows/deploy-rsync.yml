name: Deploy with Rsync

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  NODE_VERSION: '18.x'

jobs:
  deploy-rsync:
    name: Build and Deploy via Rsync
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # Build Client
      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Client
        working-directory: ./client
        run: npm run build

      # Install Server Dependencies (for production)
      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci --production

      # Setup SSH
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add VM to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      # Deploy with Rsync
      - name: Deploy Server via Rsync
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '*.log' \
            ./server/ \
            ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }}:${{ secrets.VM_PROJECT_PATH }}/server/

      - name: Deploy Client Build via Rsync
        run: |
          rsync -avz --delete \
            ./client/dist/ \
            ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }}:/var/www/amenshi4life/

      # Post-deployment commands
      - name: Post-Deployment Setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ secrets.VM_PROJECT_PATH }}/server
            
            # Install production dependencies on VM
            npm ci --production
            
            # Restart application with PM2
            pm2 restart amenshi4life-server || pm2 start server.js --name amenshi4life-server
            pm2 save
            
            # Reload nginx
            sudo systemctl reload nginx
            
            echo "✅ Deployment completed!"

      - name: Deployment Summary
        run: |
          echo "### Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed to**: ${{ secrets.VM_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
