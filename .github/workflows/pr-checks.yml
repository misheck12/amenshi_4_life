name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.x'

jobs:
  # Check code quality
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint
        working-directory: ./client
        run: npm run lint || true
        continue-on-error: true

      - name: Check for Console Logs
        run: |
          if grep -r "console.log" client/src --exclude-dir=node_modules; then
            echo "⚠️ Warning: console.log statements found in client code"
          else
            echo "✅ No console.log statements found"
          fi

  # Build verification
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [client, server]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        working-directory: ./${{ matrix.app }}
        run: npm ci

      - name: Build Application
        working-directory: ./${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" == "client" ]; then
            npm run build
          else
            echo "✅ Server dependencies installed successfully"
          fi

      - name: Check Build Size (Client)
        if: matrix.app == 'client'
        working-directory: ./client
        run: |
          build_size=$(du -sh dist | cut -f1)
          echo "📦 Build size: $build_size"
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Build size**: $build_size" >> $GITHUB_STEP_SUMMARY

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Client Dependencies
        working-directory: ./client
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Audit Server Dependencies
        working-directory: ./server
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  # PR Summary
  pr-summary:
    name: PR Summary
    needs: [code-quality, build-check, security-audit]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Generate Summary
        run: |
          echo "## Pull Request Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Check: ${{ needs.build-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.code-quality.result }}" == "success" ] && [ "${{ needs.build-check.result }}" == "success" ]; then
            echo "✅ All checks passed! Ready to merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some checks failed. Please review before merging." >> $GITHUB_STEP_SUMMARY
          fi
