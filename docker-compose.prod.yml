version: '3.8'

services:
  backend:
    image: ghcr.io/misheck12/amenshi_4_life/backend:About-us
    container_name: amenshi_backend
    restart: always
    ports:
      - "3010:3005"
    networks:
      - amenshi_network
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3005
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (r) => {if(r.statusCode!==200)throw new Error()})"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/misheck12/amenshi_4_life/frontend:About-us
    container_name: amenshi_frontend
    restart: always
    ports:
      - "3011:80"
    environment:
      - VITE_API_URL=https://amenshi4lifebackend.livingii.com/api
      - VITE_SITE_URL=https://amenshi4life.livingii.com
      - VITE_DONATION_URL=https://app.clovergive.com/App/Giving/talm10e206
    depends_on:
      - backend
    networks:
      - amenshi_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  amenshi_network:
    driver: bridge