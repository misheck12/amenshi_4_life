# Amenshi 4 Life - Nginx Reverse Proxy Configuration
# This configuration handles routing between frontend and backend services
# and provides load balancing for the Docker containers

events {
    worker_connections 1024;  # Maximum concurrent connections per worker
}

http {
    # ===== UPSTREAM SERVERS =====
    # Define backend services for load balancing and failover
    
    upstream frontend {
        server amenshi_frontend:80;  # Frontend React app served by Nginx
    }

    upstream backend {
        server amenshi_backend:3005;  # Backend Node.js API server
    }

    # ===== HTTP SERVER (Port 80) =====
    # Handles non-SSL traffic and redirects or serves content
    server {
        listen 80;
        server_name sync.livingii.com;
        
        # ===== FRONTEND ROUTES =====
        # Serve React SPA and handle client-side routing
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Handle SPA routing - redirect 404s to index.html
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }
        
        # Fallback for SPA routes (React Router)
        # When Nginx can't find a file, serve index.html for client-side routing
        location @fallback {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== API ROUTES =====
        # Proxy all API requests to the backend service
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers for cross-origin requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            
            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
                add_header 'Access-Control-Max-Age' 86400;
                return 204;
            }
        }
        
        # ===== HEALTH CHECK =====
        # Direct health check endpoint for monitoring
        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ===== HTTPS SERVER (Port 443) =====
    # Handles SSL/TLS encrypted traffic
    server {
        listen 443 ssl http2;
        server_name sync.livingii.com;
        
        # SSL Certificate configuration
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        # ===== FRONTEND ROUTES (HTTPS) =====
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # Important for HTTPS
            
            # Handle SPA routing
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }
        
        # Fallback for SPA routes (HTTPS)
        location @fallback {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ===== API ROUTES (HTTPS) =====
        location /api {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # Important for HTTPS
            
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
                add_header 'Access-Control-Max-Age' 86400;
                return 204;
            }
        }
        
        # ===== HEALTH CHECK (HTTPS) =====
        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}